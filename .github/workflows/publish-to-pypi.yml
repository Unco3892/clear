# Publish CLEAR to PyPI on GitHub Release
# Triggers when a release is published on GitHub
# Uses OIDC for secure, keyless authentication (no API tokens needed!)
#
# To use this:
# 1. Create a "pypi" environment in GitHub (Settings → Environments)
# 2. Add protection rule: Only allow deployments from the main branch
# 3. Tag and release: git tag v0.1.0 && git push --tags
# 4. Create release on GitHub (it will auto-trigger this workflow)

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # IMPORTANT: Set up a "pypi" environment in GitHub repository settings
    # This provides additional protection for production PyPI uploads
    environment:
      name: pypi
      url: https://pypi.org/project/clear-uq

    permissions:
      # CRITICAL: This permission is required for OIDC (OpenID Connect) trusted publishing
      # Allows GitHub to mint a short-lived OIDC token and exchange it for PyPI credentials
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI (optional)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.release.prerelease == true

    environment:
      name: testpypi
      url: https://test.pypi.org/project/clear-uq

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
